<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Count by Country</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            color: #333;
        }

        table {
            border-collapse: collapse;
            width: 600px;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Student Count by Country</h1>

    <table id="studentTable">
        <thead>
            <tr>
                <th>Country</th>
                <th>Student Count</th>
            </tr>
        </thead>

        <tbody id="studentTableBody">
        </tbody>
    </table>

    <script>

        async function fetchStudentData() {

            try {

                const response = await fetch(
                    "https://studentcountryucclass-ghfuaegbb3bdchdu.centralus-01.azurewebsites.net/api/getStudentCount"
                );

                if (!response.ok) {
                    throw new Error(
                        "HTTP error: " + response.status
                    );
                }

                const data = await response.json();

                console.log("Data received:", data);

                const tableBody =
                    document.getElementById("studentTableBody");

                tableBody.innerHTML = "";

                data.forEach(function(row) {

                    const tableRow = document.createElement("tr");

                    const countryCell =
                        document.createElement("td");

                    const countCell =
                        document.createElement("td");

                    countryCell.textContent = row.Country;
                    countCell.textContent = row.StudentCount;

                    tableRow.appendChild(countryCell);
                    tableRow.appendChild(countCell);

                    tableBody.appendChild(tableRow);
                });

            } catch (error) {

                console.error("Error:", error);

                document.getElementById("studentTableBody").innerHTML =
                    `<tr>
                        <td colspan="2">
                            Error loading student data
                        </td>
                    </tr>`;
            }
        }

        fetchStudentData();

    </script>

</body>

</html>
